services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: lead-hub-backend
    env_file:
      - .env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8095
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8095}
      DATA_DIR: ${DATA_DIR:-./data}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "${BACKEND_PORT:-8095}:8095"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: lead-hub-frontend
    env_file:
      - .env
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: 4173
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:4173}
      FRONTEND_BACKEND_URL: ${FRONTEND_BACKEND_URL:-http://localhost:8095}
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    depends_on:
      - backend
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.90.2
    container_name: n8n
    env_file:
      - .env
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change-me}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-with-a-long-random-string}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - ./n8n/data:/home/node/.n8n
      - ./n8n/workflows:/import
    restart: unless-stopped
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
